<form (ngSubmit)="submitForm()" #contactForm="ngForm" class="contact-form">
  <div *ngFor="let field of dynamicFields; let i = index" class="form-group">
    <label [for]="'field-' + i">{{ field.label }}:</label>
    <input *ngIf="field.type === 'text'" type="text" [id]="'field-' + i" [(ngModel)]="field.value" [name]="field.name" required>
    <input *ngIf="field.type === 'date'" type="date" [id]="'field-' + i" [(ngModel)]="field.value" [name]="field.name" required>
    <select *ngIf="field.type === 'select'" [id]="'field-' + i" [(ngModel)]="field.value" [name]="field.name" required>
      <option *ngFor="let option of field.options" [value]="option">{{ option }}</option>
    </select>
    <button type="button" (click)="removeField(i)" class="btn btn-danger">Remove</button>
  </div>
  <button type="button" (click)="addField()" class="btn btn-secondary">Add Field</button>
  <button type="submit" [disabled]="!contactForm.form.valid" class="btn btn-primary">Submit</button>
</form>
